spring.application.name=tasky

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/tasky
spring.datasource.username=tasky
spring.datasource.password=tasky

# Lo schema lo fanno le migrazioni in db/migration, non Hibernate: "validate"
# significa che all'avvio controlla che le tabelle corrispondano alle entita' e
# si ferma se non e' cosi', invece di modificarle di nascosto.
spring.jpa.hibernate.ddl-auto=validate

# Un database gia' pieno viene accettato come se fosse alla versione 1: e' il
# caso di quello di sviluppo, nato prima delle migrazioni. Su un database vuoto
# le migrazioni girano tutte dalla prima.
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

# Senza questa riga il motivo di un errore non esce dal backend: l'utente legge
# "Forbidden" invece di sapere perche'. Il formato e' quello standard (RFC 9457),
# e gli errori non previsti restano generici senza raccontare cosa c'e' dentro.
spring.mvc.problemdetails.enabled=true
spring.jpa.show-sql=true

# La chiave di firma non sta nel codice: arriva dall'ambiente.
# Se manca l'app ne genera una a caso e le sessioni durano fino al riavvio.
tasky.jwt.segreto=${TASKY_JWT_SEGRETO:}
tasky.jwt.durata-minuti=120

# Chi amministra: indirizzi separati da virgola. Non sta nel database apposta,
# cosi' nessuno puo' diventarlo scrivendo su una tabella.
tasky.amministratori=${TASKY_AMMINISTRATORI:}
